name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser scripts
        run: |
          node --check eliot_app/static/app.js
          node --check eliot_app/static/workspace.js
          node --check eliot_app/static/neural.js
          node --check eliot_app/static/transport.js
      - name: Test connection recovery
        run: node --test tests/javascript/transport.test.cjs
