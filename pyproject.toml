[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eliot-remastered"
version = "2.0.0a6"
description = "Eliot terminal and web assistant with configurable OpenAI-compatible providers"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
desktop = ["PyAutoGUI>=0.9.54,<1", "Pillow>=10,<13"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
eliot = "eliot_app.cli:main"

[tool.setuptools.packages.find]
include = ["eliot_app*"]

[tool.setuptools.package-data]
eliot_app = ["static/*", "bundled_skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

